<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Materiais de aula</title>
<style>
:root{--bg:#f4f2ee;--ink:#16161a;--muted:#6b6b76;--line:#d9d5cc;--card:#fbfaf7;--accent:#d9480f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121216;--ink:#f1efe9;--muted:#94939b;--line:#2f2f38;--card:#1a1a20;--accent:#ff7a3d}}
:root[data-theme="dark"]{--bg:#121216;--ink:#f1efe9;--muted:#94939b;--line:#2f2f38;--card:#1a1a20;--accent:#ff7a3d}
body{margin:0;padding:48px 16px;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}
main{max-width:720px;margin:0 auto}h1{font-size:34px;margin:0 0 6px}p{color:var(--muted);margin:0 0 24px}
a.c{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;text-decoration:none;color:var(--ink);margin-bottom:12px}
a.c:hover{border-color:var(--accent)}a.c b{font-size:18px}a.c span{display:block;color:var(--muted);font-size:14px}
</style></head><body><main>
<h1>Materiais de aula</h1><p>André Turra</p>
<a class="c" href="maquina-de-copy/"><b>A Máquina de Copy</b><span>O processo completo pra escrever copy com IA, interativo, com simulação de uma peça do pedido até o resultado.</span></a>
</main></body></html>
